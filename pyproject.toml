[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xed"
version = "0.1.0"
description = "Cardiff Introductory Data Science — course datasets and utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "pip>=26.1.2",
    "pooch>=1.8",
]

[project.optional-dependencies]
dev = [
    "jupytext>=1.19",
    "nbmake",
    "pytest",
    "scikit-learn>=1.9",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "codespell",
    "pyspelling",
]

[tool.hatch.build.targets.wheel]
packages = ["xed"]
