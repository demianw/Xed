[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "xed"
version = "0.1.0"
description = "Cardiff Introductory Data Science — course datasets and utilities"
readme = "README.md"
requires-python = ">=3.12"

# Core dependencies installed when a student runs:
#   pip install git+https://github.com/demianw/Xed.git
dependencies = [
    "pandas>=3.0",
    "pip>=26.1.2",
    "scikit-learn>=1.9",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "numpy",
    "pooch>=1.8",
    "tqdm"
]

[project.optional-dependencies]
chemometrics = ["rdata>=0.9"]
insurance    = ["scipy>=1.13"]
text         = [
    "datasets>=2.20",
    "sentence-transformers>=3",
    "transformers>=4.44",
    "torch",
    "llama-cpp-python>=0.3",
]
tabular-fm   = ["tabpfn", "tabicl"]
dev = [
    "jupytext>=1.19",
    "nbmake",
    "pytest",
    "ruff>=0.8",
    "codespell",
    "rdata>=0.9",
    "scipy>=1.13",
]


[project.scripts]
xed-lint       = "xed._cli:lint"
xed-lint-fix   = "xed._cli:lint_fix"
xed-fmt-check  = "xed._cli:fmt_check"
xed-fmt        = "xed._cli:fmt"
xed-check      = "xed._cli:check"
xed-fix        = "xed._cli:fix"
xed-convert    = "xed._cli:convert"
xed-sync-check = "xed._cli:sync_check"

[tool.hatch.build.targets.wheel]
packages = ["xed"]

# ---------------------------------------------------------------------------
# Hatch environments and scripts
# ---------------------------------------------------------------------------
[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
lint       = "ruff check ."
lint-fix   = "ruff check --fix ."
fmt-check  = "ruff format --check ."
fmt        = "ruff format ."
check      = ["ruff check .", "ruff format --check ."]
fix        = ["ruff check --fix .", "ruff format ."]
convert    = "python scripts/convert_notebooks.py"
sync-check = "python scripts/convert_notebooks.py --check"
all-checks = [
    "ruff check .",
    "ruff format --check .",
    "python scripts/convert_notebooks.py --check",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length    = 100
exclude = [
    ".git",
    "__pycache__",
    ".ipynb_checkpoints",
    "*.ipynb",
    "data_wrangling/solutions",
    "data_wrangling/notebook_corrected.py",
    "data_wrangling/use_case.py",
    "visualizations/plot_2d_separator.py",
    "visualizations/plot_interactive_forest.py",
    "datascience_starter_course",
]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "I"]
ignore = ["E402", "E501", "E703", "F401", "F811", "F821", "F841", "E741"]

[tool.ruff.lint.per-file-ignores]
"*/notebook*.py"                     = ["I001"]
"data_leakage/notebook*.py"          = ["I001"]
"cross_validation/notebook*.py"      = ["I001"]
"visualizations/trees*.py"           = ["I001"]
"evaluation_metrics/notebook*.py"    = ["I001"]
"insurance_time_series/notebook*.py" = ["I001"]
"us_voting/notebook*.py"             = ["I001"]
"dimensionality_reduction/notebook*.py" = ["I001"]
"data_wrangling/notebook*.py"        = ["I001", "E711"]
"movie lens/notebook*.py"            = ["I001"]
"text/text_classification*.py"       = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["xed"]

[tool.ruff.format]
quote-style  = "double"
indent-style = "space"
